      var session = loadSession(state.store, state.cycle);
      var item = catalog.filter(function(i){return i.id===id;})[0];
      var entry = entryFor(session, item);
      entry.skipped = !entry.skipped;
      saveSession(state.store, state.cycle, session);
      render();
    }
    else if(action === "skip-section"){
      // Bulk-skip whatever's left in just this one food/Bar section of a
      // supplier -- for whoever's only responsible for half the list (e.g.
      // kitchen staff skipping Bar, or vice versa), so they're not tapping
      // Skip on every single item by hand.
      var skSupplier = el.getAttribute("data-supplier");
      var skSection = el.getAttribute("data-section");
      var skItems = itemsForStore(state.store).filter(function(i){
        return i.supplier === skSupplier && (isBarCategory(i.category) ? "bar" : "food") === skSection;
      });
      var skSession = loadSession(state.store, state.cycle);
      skItems.forEach(function(item){
        var e = entryFor(skSession, item);
        if(!isTouched(e)) e.skipped = true;
      });
      saveSession(state.store, state.cycle, skSession);
      render();
    }
    else if(action === "unskip-section"){
      var unSupplier = el.getAttribute("data-supplier");
      var unSection = el.getAttribute("data-section");
      var unItems = itemsForStore(state.store).filter(function(i){
        return i.supplier === unSupplier && (isBarCategory(i.category) ? "bar" : "food") === unSection;
      });
      var unSession = loadSession(state.store, state.cycle);
      unItems.forEach(function(item){
        var e = entryFor(unSession, item);
        if(e.skipped) e.skipped = false;
      });
      saveSession(state.store, state.cycle, unSession);
      render();
    }
    else if(action === "reset-auto"){
      var id2 = el.getAttribute("data-item");
      var session2 = loadSession(state.store, state.cycle);
      var item2 = catalog.filter(function(i){return i.id===id2;})[0];
      var entry2 = entryFor(session2, item2);
      entry2.manualOrder = false;
      recomputeOrder(entry2, item2);
      saveSession(state.store, state.cycle, session2);
      render();
    }
    else if(action === "open-item-info"){
      state.itemInfoFilter = state.store;
      go("item-info");
    }
    else if(action === "close-item-info"){ go("order"); }
    else if(action === "filter-catalog"){
      state.itemInfoFilter = el.getAttribute("data-filter");
      render();
    }
    else if(action === "clear-search"){
      state.searchQuery = "";
      render();
    }
    else if(action === "clear-catalog-search"){
      state.itemInfoSearch = "";
      render();
    }
    else if(action === "reset-catalog"){
      resetCatalogEdits();
      catalog = loadCatalog();
      render();
    }
    else if(action === "fill-test-data"){
      // Testing convenience only: fills every untouched item with "0 on
      // hand" (full par ordered) so a full test submit doesn't require
      // tapping through the whole list by hand. Leaves anything already
      // entered or skipped alone.
      var fillItems = itemsForStore(state.store);
      var fillSession = loadSession(state.store, state.cycle);
      fillItems.forEach(function(item){
        var e = entryFor(fillSession, item);
        if(isTouched(e)) return;
        e.onHand = "0";
        recomputeOrder(e, item);
      });
      saveSession(state.store, state.cycle, fillSession);
      render();
    }
    else if(action === "preview-print"){
      var previewItems = itemsForStore(state.store);
      var previewSession = loadSession(state.store, state.cycle);
      var previewStoreName = STORES.filter(function(s){return s.id===state.store;})[0].name;
      var lines = [];
      previewItems.forEach(function(item){
        var e = entryFor(previewSession, item);
        // An untouched item still shows an auto-filled "par minus zero"
        // suggestion in its Order field — that was never actually reviewed,
        // so it must not appear as a real order. Only touched, unskipped,
        // non-zero items count.
        if(!isTouched(e) || e.skipped) return;
        var order = parseFloat(e.order) || 0;
        if(order <= 0) return;
        lines.push({ item: item, order: order });
      });
      state.printData = {
        storeName: previewStoreName, cycle: state.cycle, staffName: state.staffName,
        date: new Date().toISOString().slice(0,10), items: lines
      };
      state.printReturnTo = "order";
      go("print");
    }
    else if(action === "print-from-submission"){
      state.printData = printDataFromSubmission(state.lastSubmission);
      state.printReturnTo = "success";
      go("print");
    }
    else if(action === "print-back"){
      go(state.printReturnTo || "order");
    }
    else if(action === "open-settings"){
      state.settingsReturnTo = state.screen;
      go("settings");
    }
    else if(action === "close-settings"){ go(state.settingsReturnTo || "store"); }
    else if(action === "open-history"){
      state.historyReturnTo = state.screen;
      state.historyItems = undefined; // force a fresh fetch each time, since others may have submitted since the last visit
      go("history");
    }
    else if(action === "close-history"){ go(state.historyReturnTo || "order"); }
    else if(action === "view-history-item"){
      var histSub = (state.historyItems || []).filter(function(s){ return s.id === el.getAttribute("data-id"); })[0];
      if(!histSub) return;
      state.printData = printDataFromSubmission(histSub);
      state.printReturnTo = "history";
      go("print");
    }
    else if(action === "enter-reorder"){
      // The reorder list always shows every item for this supplier+section,
      // so a stale search filter can't silently drop items out of the list
      // reorderSupplierItems() expects to see.
      state.itemInfoSearch = "";
      state.reorderSupplier = el.getAttribute("data-supplier");
      state.reorderSection = el.getAttribute("data-section");
      render();
    }
    else if(action === "exit-reorder"){
      state.reorderSupplier = null;
      state.reorderSection = null;
      render();
    }
    else if(action === "request-reset"){
      state.confirmResetOpen = true;
      render();
    }
    else if(action === "dismiss-reset"){
      state.confirmResetOpen = false;
      render();
    }
    else if(action === "confirm-reset"){
      resetEverything();
    }
    else if(action === "copy-order"){
      copyOrderText(buildPrintText(state.printData));
    }
    else if(action === "copy-order-success"){
      copyOrderText(buildPrintText(printDataFromSubmission(state.lastSubmission)));
    }
    else if(action === "share-order"){
      var shareText = buildPrintText(state.printData);
      navigator.share({ title: state.printData.storeName + " — Order", text: shareText }).catch(function(){});
    }
    else if(action === "request-submit"){
      var checkItems = itemsForStore(state.store);
      var checkSession = loadSession(state.store, state.cycle);
      var anyUntouched = checkItems.some(function(i){ return !isTouched(entryFor(checkSession,i)); });
      if(anyUntouched){
        state.confirmSubmitOpen = true;
        render();
      } else {
        submitList();
      }
    }
    else if(action === "cancel-submit" || action === "dismiss-overlay"){
      state.confirmSubmitOpen = false;
      render();
    }
    else if(action === "confirm-submit"){
      submitList();
    }
    else if(action === "start-new"){
      state.store = null; state.staffName = null; state.lastSubmission = null; state.searchQuery = "";
      go("store");
    }
  });

  document.addEventListener("click", function(e){
    if(state.openOnHandPicker && !e.target.closest(".onhand-picker")){
      state.openOnHandPicker = null;
      render();
    }
  }, true);

  app.addEventListener("input", function(e){
    var el = e.target;
    var action = el.getAttribute("data-action");
    if(!action) return;

    if(action === "search-query" || action === "search-catalog"){
      if(action === "search-query") state.searchQuery = el.value;
      else state.itemInfoSearch = el.value;
      var cursorPos = null;
      try{ cursorPos = el.selectionStart; }catch(err){}
      render();
      var fresh = app.querySelector('[data-action="'+action+'"]');
      if(fresh){
        fresh.focus();
        var pos = cursorPos == null ? fresh.value.length : Math.min(cursorPos, fresh.value.length);
        try{ fresh.setSelectionRange(pos, pos); }catch(err){}
      }
      return;
    }

    if(action === "edit-name" || action === "edit-name-es"){
      // Renaming changes the bold headline right above this input, which a
      // plain flashSaved() (no re-render, like edit-unit) would leave
      // stale -- so this does a full render instead, with the same
      // cursor-position preservation as the search inputs above so typing
      // doesn't feel like it's fighting you.
      var nameId = el.getAttribute("data-item");
      var nameItem = catalog.filter(function(i){return i.id===nameId;})[0];
      if(action === "edit-name"){
        nameItem.name = el.value;
        saveCatalogFieldEdit(nameItem.id, "name", nameItem.name);
      } else {
        nameItem.nameEs = el.value || null;
        saveCatalogFieldEdit(nameItem.id, "nameEs", nameItem.nameEs);
      }
      var namePos = null;
      try{ namePos = el.selectionStart; }catch(err){}
      render();
      var freshName = app.querySelector('.catalog-card[data-item="'+nameId+'"] [data-action="'+action+'"]');
      if(freshName){
        freshName.focus();
        var posN = namePos == null ? freshName.value.length : Math.min(namePos, freshName.value.length);
        try{ freshName.setSelectionRange(posN, posN); }catch(err){}
      }
      return;
    }

    var id = el.getAttribute("data-item");
    var session = loadSession(state.store, state.cycle);
    var item = catalog.filter(function(i){return i.id===id;})[0];

    if(action === "input-onhand"){
      var entry = entryFor(session, item);
      entry.onHand = el.value;
      if(entry.skipped && el.value !== "") entry.skipped = false;
      recomputeOrder(entry, item);
      saveSession(state.store, state.cycle, session);
      // update just this card's dependent bits without a full re-render jump on this field
      refreshCard(item, entry);
    }
    else if(action === "input-order"){
      var entry2 = entryFor(session, item);
      entry2.order = el.value;
      entry2.manualOrder = true;
      if(entry2.skipped && el.value !== "") entry2.skipped = false;
      saveSession(state.store, state.cycle, session);
      refreshCard(item, entry2);
    }
    else if(action === "edit-unit"){
      // Real source data has gaps (dashes on the paper sheet) — unit is
      // otherwise fixed at catalog-setup time, but needs to be fixable here
      // too so those gaps don't stay stuck forever.
      item.unit = el.value;
      saveCatalogFieldEdit(item.id, "unit", item.unit);
      flashSaved(el);
    }
    else if(action === "edit-supplier"){
      // Changing supplier moves the item into a different group, so this
      // needs a full re-render (unlike the text fields, there's no
      // in-progress typing here to preserve focus for).
      item.supplier = el.value;
      saveCatalogFieldEdit(item.id, "supplier", item.supplier);
      render();
    }
    else if(action === "edit-units-per-box" || action === "edit-weight-per-unit"){
      // Blank means "not applicable" (null), not zero — zero would wrongly
      // switch on rounding / weight-calc logic that reads these as set.
      var raw = el.value.trim();
      var parsed = raw === "" ? null : (parseFloat(raw) || 0);
      var field = action === "edit-units-per-box" ? "unitsPerBox" : "weightPerUnit";
      item[field] = parsed;
      saveCatalogFieldEdit(item.id, field, parsed);
      flashSaved(el);
      updateBoxWeight(item);
    }
    else if(action === "edit-par-wed" || action === "edit-par-sun"){
      var parField = action === "edit-par-wed" ? "parWed" : "parSun";
      item[parField] = parseFloat(el.value) || 0;
      saveCatalogFieldEdit(item.id, parField, item[parField]);
      // A real edit means this is no longer an invented placeholder par.
      if(item.placeholder){
        item.placeholder = false;
        saveCatalogFieldEdit(item.id, "placeholder", false);
        var badge = el.closest(".catalog-card") && el.closest(".catalog-card").querySelector(".est-badge");
        if(badge) badge.remove();
      }
      flashSaved(el);
    }
  });

  function updateBoxWeight(item){
    var card = app.querySelector('.catalog-card[data-item="'+item.id+'"]');
    if(!card) return;
    var el = card.querySelector('[data-role="box-weight"]');
    if(!el) return;
    var bw = boxWeight(item);
    el.textContent = bw == null ? "Box weight: —" : "Box weight: " + fmt(bw) + " g";
  }

  function flashSaved(inputEl){
    var card = inputEl.closest(".catalog-card");
    if(!card) return;
    var flash = card.querySelector('[data-role="saved-flash"]');
    if(!flash) return;
    flash.classList.add("show");
    clearTimeout(flash._t);
    flash._t = setTimeout(function(){ flash.classList.remove("show"); }, 900);
  }

  // Re-render just the touched card's HTML (progress header still needs a
  // full render, but we avoid stealing input focus on every keystroke by
  // only swapping the one card + header stats). Whichever field the person
  // is actively typing in — "you have" or "order" — keeps focus and cursor
  // position across the swap.
  function refreshCard(item, entry){
    var items = itemsForStore(state.store);
    var session = loadSession(state.store, state.cycle);

    // If this edit just finished the last item in its supplier group and
    // that group is about to auto-collapse, the row (and its siblings) are
    // leaving the DOM entirely — a targeted patch can't express that, so
    // fall back to a full render for this one edit.
    var supplierItems = items.filter(function(i){ return i.supplier === item.supplier; });
    var supplierRemaining = supplierItems.filter(function(i){ return !isTouched(entryFor(session,i)); }).length;
    var willCollapse = !state.searchQuery && supplierCollapsed(session, item.supplier, supplierRemaining);
    var alreadyCollapsed = !app.querySelector('.item-row-wrap[data-item="'+item.id+'"]');
    if(willCollapse && !alreadyCollapsed){
      render();
      return;
    }

    var progressWrap = app.querySelector(".progress-line");
    var touchedCount = items.filter(function(i){ return isTouched(entryFor(session,i)); }).length;
    var pct = items.length ? Math.round((touchedCount/items.length)*100) : 0;
    if(progressWrap){
      progressWrap.querySelector(".num").textContent = touchedCount + " of " + items.length + " reviewed";
      progressWrap.querySelector(".progress-bar > i").style.width = pct + "%";
    }

    var card = app.querySelector('.item-row-wrap[data-item="'+item.id+'"]');
    if(!card) return;
    var active = document.activeElement;
    var focusedAction = null, cursorPos = null;
    if(active && card.contains(active) && active.tagName === "INPUT"){
      focusedAction = active.getAttribute("data-action");
      try{ cursorPos = active.selectionStart; }catch(err){ cursorPos = null; }
    }
    var newHtml = renderItemCard(item, entry);
    var temp = document.createElement("div");
    temp.innerHTML = newHtml;
    var newCard = temp.firstChild;
    card.parentNode.replaceChild(newCard, card);
    if(focusedAction){
      var input = newCard.querySelector('[data-action="'+focusedAction+'"]');
      if(input){
        input.focus();
        var pos = cursorPos == null ? input.value.length : Math.min(cursorPos, input.value.length);
        try{ input.setSelectionRange(pos, pos); }catch(err){}
      }
    }
    // supplier "left" counter
    var group = newCard.closest(".supplier-group");
    if(group){
      var supplierName = item.supplier;
      var groupItems = items.filter(function(i){ return i.supplier === supplierName; });
      var remaining = groupItems.filter(function(i){ return !isTouched(entryFor(session,i)); }).length;
      var countEl = group.querySelector(".count");
      if(countEl) countEl.textContent = remaining === 0 ? "all reviewed" : remaining + " left";
    }
  }

  function submitList(){
    var items = itemsForStore(state.store);
    var session = loadSession(state.store, state.cycle);
    var storeName = STORES.filter(function(s){return s.id===state.store;})[0].name;
    var record = {
      date: new Date().toISOString().slice(0,10),
      store: state.store,
      storeName: storeName,
      cycle: state.cycle,
      staffName: state.staffName,
      itemCount: items.length,
      items: items.map(function(item){
        var e = entryFor(session, item);
        return {
          // Firestore rejects any field that's `undefined` (even nested),
          // and most catalog items simply omit nameEs rather than setting
          // it to null -- coerce it so the shared write doesn't fail.
          id:item.id, name:item.name, nameEs:item.nameEs || null, supplier:item.supplier,
          unit:item.unit, unitsPerBox:item.unitsPerBox,
          onHand:e.onHand, order:e.order, skipped:e.skipped
        };
      })
    };
    var submissions = readJSON(SUBMISSIONS_KEY, []);
    submissions.push(record);
    writeJSON(SUBMISSIONS_KEY, submissions);
    state.historyWriteStatus = "pending";
    pushSharedSubmission(record);

    clearSession(state.store, state.cycle);
    state.confirmSubmitOpen = false;
    state.lastSubmission = record;
    go("success");
  }

  // Mirrors a submission into a shared Firestore collection everyone can
  // read, separate from the per-device backup doc in writeJSON/pushToCloud.
  // Updates state.historyWriteStatus so the success screen can show whether
  // it actually worked, instead of failing silently with no visible trace.
  function pushSharedSubmission(record){
    if(!isFirebaseConfigured() || !cloudReady){
      state.historyWriteStatus = "unavailable";
      return;
    }
    try{
      firebase.firestore().collection("shared_submissions").add(Object.assign({}, record, {
        submittedAt: firebase.firestore.FieldValue.serverTimestamp()
      })).then(function(){
        state.historyWriteStatus = "ok";
        render();
      }).catch(function(err){
        state.historyWriteStatus = "error";
        state.historyWriteError = (err && (err.code || err.message)) || "unknown error";
        render();
      });
    }catch(e){
      state.historyWriteStatus = "error";
      state.historyWriteError = (e && e.message) || "unknown error";
      render();
    }
  }

  /* ============================= INIT ============================= */

  // The actual startup sequence, run once - either immediately (no Firebase
  // configured, or it's unreachable) or after a prior cloud save has been
  // restored into localStorage, so loadCatalog()/restoreAppState() always
  // see the right data regardless of which device this is.
  function boot(){
    catalog = loadCatalog();
    restoreAppState();
    render();
  }

  initCloudSync(boot);
})();
</script>
</body>
</html>
