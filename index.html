<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Order List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
<style>
  :root{
    --bg:#FDF9F0;
    --surface:#FFFFFF;
    --surface-2:#FBF5E5;
    --surface-3:#F0E4CC;
    --text:#3A1018;
    --text-muted:rgba(48,26,16,.82);
    --text-faint:rgba(48,26,16,.66);
    --border:rgba(48,26,16,.38);
    --border-strong:rgba(48,26,16,.55);
    --accent:#245C8A;
    --accent-ink:#163F60;
    --accent-contrast:#F5F9FC;
    --success:#4C7132;
    --success-tint:rgba(76,113,50,.16);
    --warning:#7A4E14;
    --warning-tint:rgba(122,78,20,.16);
    --skip:#5C5340;
    --skip-tint:rgba(92,83,64,.2);
    --danger:#A8432F;
    --shadow:0 1px 2px rgba(58,16,24,.06), 0 6px 20px -8px rgba(58,16,24,.18);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1013;
      --surface:#271719;
      --surface-2:#2E1B1E;
      --surface-3:#382227;
      --text:#F3E9DB;
      --text-muted:rgba(243,233,219,.74);
      --text-faint:rgba(243,233,219,.55);
      --border:rgba(243,233,219,.2);
      --border-strong:rgba(243,233,219,.34);
      --accent:#6FA8DC;
      --accent-ink:#BFE0FF;
      --accent-contrast:#0F2436;
      --success:#94BE73;
      --success-tint:rgba(148,190,115,.16);
      --warning:#D9A868;
      --warning-tint:rgba(217,168,104,.16);
      --skip:#A79A86;
      --skip-tint:rgba(167,154,134,.18);
      --danger:#E28371;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -10px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1013;
    --surface:#271719;
    --surface-2:#2E1B1E;
    --surface-3:#382227;
    --text:#F3E9DB;
    --text-muted:rgba(243,233,219,.74);
    --text-faint:rgba(243,233,219,.55);
    --border:rgba(243,233,219,.2);
    --border-strong:rgba(243,233,219,.34);
    --accent:#6FA8DC;
    --accent-ink:#BFE0FF;
    --accent-contrast:#0F2436;
    --success:#94BE73;
    --success-tint:rgba(148,190,115,.16);
    --warning:#D9A868;
    --warning-tint:rgba(217,168,104,.16);
    --skip:#A79A86;
    --skip-tint:rgba(167,154,134,.18);
    --danger:#E28371;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -10px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"DM Sans", system-ui, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{
    font-family:"Fraunces", Georgia, serif;
    text-wrap:balance;
    margin:0;
  }
  button{font-family:inherit; color:inherit;}
  input{font-family:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}

  #app{
    max-width:640px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- shared bits ---------- */
  .script{
    font-family:"Caveat", cursive;
    color:var(--accent-ink);
    font-size:1.35rem;
    font-weight:600;
  }
  .wordmark{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:1.1rem;
    letter-spacing:.02em;
  }
  .steps{display:flex; gap:6px; justify-content:center;}
  .steps span{width:6px;height:6px;border-radius:50%;background:var(--border-strong);}
  .steps span.active{background:var(--accent); width:18px; border-radius:4px;}

  .centered-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:32px 24px 48px;
    text-align:center;
  }
  .centered-screen .heading{display:flex; flex-direction:column; gap:8px; align-items:center;}
  .centered-screen h1{font-size:1.9rem;}
  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
  }
  @media (max-width:420px){ .choice-grid{grid-template-columns:1fr;} }
  .choice-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:28px 16px;
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .choice-card:active{transform:scale(.97);}
  .choice-card:hover{border-color:var(--accent);}
  .choice-card .icon{font-size:1.9rem;}
  .choice-card .label{font-family:"Fraunces",serif; font-size:1.15rem; font-weight:600;}
  .choice-card .sub{font-size:.8rem; color:var(--text-muted);}

  .name-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .name-row{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 18px;
    font-size:1.05rem;
    font-weight:600;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .name-row:active{transform:scale(.98);}
  .name-row .chevron{color:var(--text-faint); font-size:1.1rem;}

  .link-btn{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:.85rem;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
  .back-row{
    display:flex; align-items:center; gap:6px;
    padding:14px 20px 0;
    color:var(--text-muted);
    font-size:.9rem;
    cursor:pointer;
    align-self:flex-start;
  }

  /* ---------- order list / item info shell ---------- */
  .app-header{
    background:var(--bg);
    padding:14px 18px 10px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .app-header .row1{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .identity{display:flex; flex-direction:column; gap:1px;}
  .identity .store{font-family:"Fraunces",serif; font-size:1.25rem; font-weight:600;}
  .identity .staff{font-size:.78rem; color:var(--text-muted);}
  .header-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .icon-btn{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    min-width:38px; min-height:38px;
    padding:4px 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:1.05rem;
    cursor:pointer;
  }
  .icon-btn:active{transform:scale(.94);}
  .icon-btn-label{font-size:.56rem; font-weight:700; color:var(--text-muted); line-height:1; white-space:nowrap;}

  .cycle-toggle{
    display:inline-flex;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px;
    align-self:flex-start;
    gap:2px;
  }
  .cycle-toggle button{
    border:none; background:none;
    padding:6px 16px;
    border-radius:999px;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    color:var(--text-muted);
  }
  .cycle-toggle button.active{
    background:var(--accent);
    color:var(--accent-contrast);
  }

  .progress-line{display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--text-muted);}
  .progress-bar{flex:1; height:5px; border-radius:999px; background:var(--surface-3); overflow:hidden;}
  .progress-bar > i{display:block; height:100%; background:var(--success); border-radius:999px; transition:width .25s ease;}

  .search-row{position:relative; display:flex;}
  .search-input{
    width:100%;
    border:1px solid var(--border-strong);
    background:var(--surface);
    border-radius:999px;
    padding:8px 34px 8px 14px;
    font-size:16px;
    color:var(--text);
  }
  .search-input:focus{border-color:var(--accent);}
  .search-input::placeholder{color:var(--text-faint);}
  .search-clear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; border-radius:50%; border:none;
    background:var(--surface-3); color:var(--text-muted);
    font-size:.7rem; line-height:1; cursor:pointer;
  }
  .empty-search{
    padding:32px 16px; text-align:center; color:var(--text-muted); font-size:.88rem;
  }

  .list-body{
    flex:1;
    padding:0 8px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .supplier-group{display:flex; flex-direction:column;}
  .supplier-head{
    display:flex; align-items:baseline; justify-content:space-between;
    width:100%; border:none; font:inherit; text-align:left; cursor:pointer;
    padding:8px 6px 3px;
    position:sticky; top:var(--content-top, 96px);
    background:linear-gradient(var(--bg) 75%, transparent);
    z-index:4;
  }
  .supplier-head h2{font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text-muted); font-family:"DM Sans",sans-serif; font-weight:700;}
  .supplier-head-right{display:flex; align-items:center; gap:8px;}
  .chevron{font-size:.65rem; color:var(--text-faint); width:10px; text-align:center;}
  .supplier-head .count{font-size:.72rem; color:var(--text-faint); font-variant-numeric:tabular-nums;}
  /* Category is an inline tag, not a section break -- fridges and shelves
     don't group by it, so items within a supplier stay in one continuous
     (optionally custom-ordered) list instead of being split by it. */
  .row-category, .reorder-category{font-size:.76rem; color:var(--text-faint); font-style:italic;}

  /* Spreadsheet-style row grid, shared by the column-header strip and every
     item row so the "Have"/"Order" labels line up over their inputs. */
  .row-grid{
    display:grid;
    grid-template-columns: 10px 1fr 50px 50px 38px;
    gap:7px;
    align-items:center;
  }
  .column-header{
    position:sticky; top:0; z-index:6; background:var(--bg);
    padding:8px 6px 6px;
    font-size:.85rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text);
  }
  .column-header span:nth-child(3), .column-header span:nth-child(4){ text-align:center; }
  .column-header span:nth-child(4){ border-left:1px solid var(--border-strong); padding-left:7px; }

  .item-row-wrap{border-bottom:1px solid var(--border);}
  .item-row-wrap.is-skipped{opacity:.55;}
  .item-row{padding:6px 6px;}
  .status-dot{
    width:10px; height:10px; border-radius:50%; flex:none;
    background:var(--border-strong); justify-self:center;
  }
  .status-dot.done{background:var(--success);}
  .status-dot.skipped{background:var(--skip);}
  .row-name{min-width:0;}
  .item-name{
    font-weight:600; font-size:.82rem; line-height:1.25; overflow-wrap:break-word;
    background:none; border:none; padding:0; font-family:inherit; color:inherit;
    text-align:left; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  }
  .info-caret{
    font-size:1.15rem; color:var(--accent); font-weight:400; line-height:1;
    display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; min-height:22px; margin:-4px 0;
  }
  .info-panel{
    margin:0 6px 6px 21px; padding:8px 10px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    display:flex; flex-direction:column; gap:4px;
  }
  .info-row{display:flex; justify-content:space-between; font-size:.76rem; color:var(--text-muted);}
  .info-row b{color:var(--text); font-variant-numeric:tabular-nums; font-weight:700;}
  .info-edit-link{
    align-self:flex-start; background:none; border:none; padding:2px 0 0;
    font-size:.72rem; color:var(--accent-ink); text-decoration:underline; cursor:pointer;
  }
  .row-hint{font-size:.66rem; color:var(--text-muted); line-height:1.3;}
  .name-es{font-size:.76rem; color:var(--text-faint); font-style:italic; margin-top:1px;}
  .row-hint .name-es{font-size:inherit; margin-top:0;}

  .cell-wrap{position:relative;}
  .cell-input{
    width:100%;
    border:1px solid var(--border-strong);
    background:var(--surface);
    border-radius:8px;
    padding:5px 3px;
    font-size:16px; /* iOS/Android zoom in on focus below 16px - this avoids that */
    font-weight:600;
    text-align:center;
  }
  .cell-input:focus{border-color:var(--accent);}
  .cell-input.order{border-color:var(--accent); background:var(--surface-2);}

  .onhand-picker{position:relative;}
  .onhand-trigger{cursor:pointer;}
  .onhand-dropdown{
    position:absolute; top:calc(100% + 3px); left:0; right:0; z-index:20;
    background:var(--surface); border:1px solid var(--border-strong);
    border-radius:8px; box-shadow:var(--shadow); overflow:hidden;
  }
  .onhand-dropdown-scroll{max-height:96px; overflow-y:auto;}
  .onhand-option{
    display:block; width:100%; text-align:center; background:none; border:none;
    border-bottom:1px solid var(--border); padding:8px 4px; font-size:13px; font-weight:600;
    color:var(--text); font-family:inherit; cursor:pointer;
  }
  .onhand-option:last-child{border-bottom:none;}
  .onhand-option.active{background:var(--success-tint); color:var(--success); font-weight:800;}
  .onhand-option:active{background:var(--surface-2);}
  .manual-dot{
    position:absolute; top:-3px; right:-3px; width:7px; height:7px; border-radius:50%;
    background:var(--accent); border:1px solid var(--surface); pointer-events:none;
  }

  .skip-btn{
    width:100%; min-height:28px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
    font-size:.6rem;
    font-weight:700;
    border-radius:8px;
    cursor:pointer;
    padding:0;
  }
  .skip-btn.active{background:var(--skip-tint); border-color:var(--skip); color:var(--skip);}
  .skip-btn:active{transform:scale(.94);}

  .row-note{
    font-size:.68rem; color:var(--text-muted);
    padding:0 6px 6px 21px;
    display:flex; flex-wrap:wrap; gap:4px 8px;
  }
  .row-note .note-warn{color:var(--warning);}
  .reset-link{
    background:none; border:none; padding:0; font:inherit;
    color:var(--accent-ink); text-decoration:underline; cursor:pointer;
  }

  .bottom-bar{
    background:var(--bg);
    border-top:1px solid var(--border);
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px;
  }
  .submit-btn{
    background:var(--accent);
    color:var(--accent-contrast);
    border:none;
    border-radius:var(--radius-md);
    padding:14px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  .submit-btn:active{transform:scale(.98);}

  .preview-btn{
    background:var(--surface-2);
    color:var(--accent-ink);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-md);
    padding:11px;
    font-size:.9rem;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  .preview-btn:active{transform:scale(.98);}

  /* ---------- settings preview (concept only) ---------- */
  .settings-page{max-width:640px; margin:0 auto; padding:8px 18px 40px;}
  .settings-banner{
    background:var(--warning-tint); color:var(--warning); border:1px solid var(--warning);
    border-radius:var(--radius-md); padding:12px 14px; font-size:.82rem; line-height:1.5; margin-bottom:18px;
  }
  .settings-title{font-size:1.5rem; margin-bottom:16px;}
  .settings-section{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:14px 16px; margin-bottom:14px;
  }
  .settings-section h3{font-size:.95rem; font-family:"DM Sans",sans-serif; font-weight:800;}
  .settings-hint{font-size:.78rem; color:var(--text-muted); margin:2px 0 10px;}
  .settings-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--border); font-size:.9rem; font-weight:600;
  }
  .settings-row-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
    padding:4px 10px; font-size:.72rem; font-weight:700; color:var(--text-faint); cursor:not-allowed;
  }
  .settings-add{
    width:100%; margin-top:10px; background:none; border:1px dashed var(--border-strong);
    border-radius:var(--radius-sm); padding:9px; font-size:.85rem; font-weight:700;
    color:var(--text-faint); cursor:not-allowed;
  }
  .settings-danger{
    width:100%; background:none; border:1px solid var(--danger);
    border-radius:var(--radius-sm); padding:10px; font-size:.85rem; font-weight:700;
    color:var(--danger); cursor:pointer;
  }
  .settings-danger:active{background:var(--danger); color:var(--accent-contrast);}

  /* ---------- drag-to-reorder (Item Info) ---------- */
  .section-head{display:flex; align-items:center; gap:8px; padding:4px 6px 6px;}
  .section-head .reorder-btn{margin-left:auto;}
  .bar-section{
    margin-top:10px; border-top:2px solid var(--accent); border-bottom:2px solid var(--accent);
    padding:4px 0 6px;
  }
  .bar-section-label{
    font-size:.78rem; color:var(--accent-ink); font-weight:800;
    letter-spacing:.03em; text-transform:uppercase;
  }
  .section-actions{display:flex; justify-content:flex-end; gap:8px; padding:0 6px 4px;}
  .section-head .skip-section-btn{margin-left:auto;}
  .skip-section-btn{
    background:var(--skip-tint); border:1px solid var(--skip); border-radius:999px;
    padding:4px 11px; font-size:.68rem; font-weight:700; color:var(--skip); cursor:pointer;
  }
  .skip-section-btn:active{transform:scale(.96);}
  .skip-section-btn.unskip{background:var(--surface-2); border-color:var(--border-strong); color:var(--accent-ink);}
  .reorder-btn{
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:999px;
    padding:5px 12px; font-size:.72rem; font-weight:700; color:var(--accent-ink); cursor:pointer;
  }
  .reorder-hint{font-size:.76rem; color:var(--text-muted); padding:0 6px 8px; margin:0;}
  .reorder-list{display:flex; flex-direction:column; gap:6px; padding:0 6px 12px;}
  .reorder-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:11px 12px; font-size:.9rem; font-weight:600;
  }
  .drag-handle{font-size:1.2rem; color:var(--text-faint); line-height:1; cursor:grab; touch-action:none;}
  .reorder-name{flex:1;}
  .sortable-ghost{opacity:.35;}
  .sortable-chosen{border-color:var(--accent); background:var(--surface-2);}
  .sortable-drag{box-shadow:var(--shadow);}

  /* ---------- order history (shared across everyone) ---------- */
  .history-row{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:13px 14px; box-shadow:var(--shadow); display:flex; align-items:center;
    justify-content:space-between; gap:10px; cursor:pointer; text-align:left; width:100%; font:inherit;
  }
  .history-row:active{background:var(--surface-2);}
  .history-row-main{display:flex; flex-direction:column; gap:3px;}
  .history-row-main b{font-family:"Fraunces",serif; font-size:1.02rem;}
  .history-meta{font-size:.78rem; color:var(--text-muted);}
  .history-chevron{color:var(--text-faint); font-size:1.1rem;}
  .history-list{padding-top:16px;}

  /* ---------- printable order ---------- */
  .print-page{max-width:640px; margin:0 auto; padding:16px 18px 40px;}
  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px;}
  .top-actions-right{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .top-actions .preview-btn, .top-actions .submit-btn{width:auto; padding:10px 14px; font-size:.85rem;}
  .copy-flash{
    background:var(--success-tint); color:var(--success); border:1px solid var(--success);
    border-radius:var(--radius-sm); padding:8px 12px; font-size:.82rem; margin-bottom:14px;
  }
  .print-hint{font-size:.76rem; color:var(--text-faint); text-align:center; margin-top:18px;}
  .print-header{margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid var(--text);}
  .print-header h1{font-size:1.3rem; margin-top:4px;}
  .print-header p{margin:2px 0 0; color:var(--text-muted); font-size:.85rem;}
  .print-supplier{margin-bottom:16px; break-inside:avoid;}
  .print-supplier h3{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-muted); border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:6px;
  }
  .print-row{
    display:flex; justify-content:space-between; gap:12px;
    padding:5px 0; font-size:.94rem; border-bottom:1px dotted var(--border);
  }
  .print-row i{color:var(--text-faint); font-style:italic; font-weight:400;}
  .print-row b{font-variant-numeric:tabular-nums; white-space:nowrap;}
  .print-empty{color:var(--text-muted); padding:24px 0; text-align:center;}

  @media print{
    .no-print{display:none !important;}
    body, .print-page{background:#fff !important; color:#000 !important;}
    .print-header{border-bottom-color:#000;}
    .print-supplier h3{color:#000; border-bottom-color:#000;}
    .print-row{border-bottom-color:#ccc; color:#000;}
    .print-row i{color:#555;}
  }

  /* ---------- item info screen ---------- */
  .filter-tabs{
    display:flex; gap:6px; padding:8px 18px; overflow-x:auto;
    position:sticky; top:0; z-index:6; background:var(--bg);
  }
  .filter-tabs button{
    border:1px solid var(--border);
    background:var(--surface);
    padding:6px 14px;
    border-radius:999px;
    font-size:.8rem;
    font-weight:600;
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-tabs button.active{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}

  .catalog-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:13px 14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  }
  .catalog-card .head{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .catalog-card .store-tag{font-size:.66rem; text-transform:uppercase; color:var(--text-faint); letter-spacing:.05em;}
  .type-chip{
    font-size:.62rem; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-faint); border:1px solid var(--border); border-radius:6px;
    padding:1px 5px; margin-left:6px; vertical-align:1px;
  }
  .est-badge{
    font-size:.6rem; text-transform:uppercase; letter-spacing:.04em; font-weight:700;
    color:var(--warning); background:var(--warning-tint); border-radius:6px;
    padding:1px 5px; margin-left:5px; vertical-align:1px;
  }
  .catalog-fields{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .catalog-fields .field label{font-size:.62rem;}
  .catalog-fields input, .par-row input, .catalog-fields select{
    width:100%; border:1px solid var(--border-strong); background:var(--surface-2);
    border-radius:var(--radius-sm); padding:8px 8px; font-size:16px; font-weight:600;
    color:var(--text); font-family:inherit;
  }
  .par-row{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    border-top:1px dashed var(--border); padding-top:8px;
  }
  .par-row .field label{font-size:.62rem;}
  .box-weight{
    font-size:.76rem; color:var(--text-muted); border-top:1px dashed var(--border);
    padding-top:8px; font-variant-numeric:tabular-nums;
  }
  .saved-flash{color:var(--success); font-size:.68rem; font-weight:700; opacity:0; transition:opacity .2s;}
  .saved-flash.show{opacity:1;}

  /* ---------- modal / toast ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(28,16,19,.45);
    display:flex; align-items:flex-end; justify-content:center; z-index:20;
    padding:16px;
  }
  .sheet{
    background:var(--surface); border-radius:var(--radius-lg); padding:22px 20px calc(20px + env(safe-area-inset-bottom));
    width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px;
    box-shadow:var(--shadow);
  }
  .sheet h3{font-size:1.15rem;}
  .sheet p{margin:0; font-size:.9rem; color:var(--text-muted); line-height:1.5;}
  .sheet-actions{display:flex; gap:10px;}
  .sheet-actions button{flex:1; border-radius:var(--radius-md); padding:12px; font-weight:700; font-size:.92rem; cursor:pointer; border:1px solid var(--border);}
  .btn-ghost{background:var(--surface); color:var(--text);}
  .btn-primary{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}

  .success-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:40px 24px; text-align:center;}
  .success-screen .check{
    width:64px; height:64px; border-radius:50%; background:var(--success-tint); color:var(--success);
    display:flex; align-items:center; justify-content:center; font-size:1.8rem;
  }
  .success-screen p{color:var(--text-muted); font-size:.9rem; max-width:36ch;}
  .history-status{font-size:.8rem; margin:-6px 0 0;}
  .history-status.ok{color:var(--success);}
  .history-status.error{color:var(--danger);}

  .footer-links{display:flex; justify-content:center; padding:10px 0 22px;}

  .cloud-status-badge{
    position:fixed; bottom:8px; right:8px; z-index:50;
    font-size:.65rem; font-weight:700; color:var(--text-faint);
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:3px 9px; pointer-events:none; opacity:.85;
  }
  .cloud-status-badge:empty{display:none;}
</style>
</head>

  /* ============================= STORAGE ============================= */

  function readJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function writeJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
    scheduleCloudSync();
  }

  /* ============================= CLOUD BACKUP (Firebase) =============================
     localStorage stays the fast, synchronous source of truth for every read/write in
     the app (nothing else changes) - this layer just mirrors the whole bonita_ol_*
     slice of localStorage up to Firestore under the current anonymous user, and
     restores it on a fresh browser/device. If Firebase isn't configured yet, or the
     network's unavailable, the app works exactly as before (local-only). */

  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyBtYxo1KYuKrwM9i6CMtfA-voSMUmJdk4c",
    authDomain: "bonita-inventory.firebaseapp.com",
    projectId: "bonita-inventory",
    storageBucket: "bonita-inventory.firebasestorage.app",
    messagingSenderId: "410464479605",
    appId: "1:410464479605:web:60b7425f468140a9654b3c"
  };

  var cloudReady = false;
  var cloudUid = null;
  var cloudSyncTimer = null;
  var catalogSyncTimer = null;

  function isFirebaseConfigured(){
    return typeof firebase !== "undefined" && FIREBASE_CONFIG.apiKey !== "REPLACE_ME";
  }

  function allLocalKeys(){
    var keys = [];
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf("bonita_ol_") === 0) keys.push(k);
    }
    return keys;
  }

  function setCloudStatus(s){
    var el = document.querySelector("[data-role=cloud-status]");
    if(el) el.textContent = s === "synced" ? "☁ Saved" : s === "connecting" ? "☁ Saving…" : s === "error" ? "⚠ Not saved to cloud" : "";
  }

  // Debounced so a burst of edits (typing, etc.) becomes one write, not one per keystroke.
  function scheduleCloudSync(){
    if(!cloudReady) return;
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(pushToCloud, 800);
  }

  function pushToCloud(){
    if(!cloudReady || !cloudUid) return;
    var blob = {};
    allLocalKeys().forEach(function(k){ blob[k] = localStorage.getItem(k); });
    setCloudStatus("connecting");
    firebase.firestore().collection("users").doc(cloudUid).set({ data: blob, updatedAt: Date.now() })
      .then(function(){ setCloudStatus("synced"); })
      .catch(function(){ setCloudStatus("error"); });
  }

  // Catalog overrides/order are the one thing that's shared across every
  // device, not private per-device like the rest of this backup -- the
  // point of editing the catalog is that everyone sees the same result.
  function scheduleCatalogSync(){
    if(!cloudReady) return;
    clearTimeout(catalogSyncTimer);
    catalogSyncTimer = setTimeout(pushSharedCatalog, 800);
  }

  function pushSharedCatalog(){
    if(!cloudReady) return;
    var payload = {
      overrides: readJSON(CATALOG_OVERRIDES_KEY, {}),
      order: readJSON(CATALOG_ORDER_KEY, {}),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    firebase.firestore().collection("shared_catalog").doc("current").set(payload).catch(function(){});
  }

  // Runs once at startup, before the first render: try to restore a previous save
  // for this anonymous user into localStorage, then let the app boot normally.
  function initCloudSync(onDone){
    if(!isFirebaseConfigured()){ onDone(); return; }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      var timedOut = false;
      var timer = setTimeout(function(){ timedOut = true; onDone(); }, 4000);

      firebase.auth().signInAnonymously().then(function(cred){
        cloudUid = cred.user.uid;
        return firebase.firestore().collection("users").doc(cloudUid).get();
      }).then(function(doc){
        if(doc && doc.exists){
          var blob = doc.data().data || {};
          Object.keys(blob).forEach(function(k){ localStorage.setItem(k, blob[k]); });
        }
        // Catalog overrides/order are shared, not part of this device's own
        // backup -- pull the current shared state in too, overwriting
        // whatever this device had locally. The shared copy is always the
        // source of truth for catalog edits.
        return firebase.firestore().collection("shared_catalog").doc("current").get();
      }).then(function(sharedDoc){
        if(sharedDoc && sharedDoc.exists){
          var data = sharedDoc.data();
          if(data.overrides) localStorage.setItem(CATALOG_OVERRIDES_KEY, JSON.stringify(data.overrides));
          if(data.order) localStorage.setItem(CATALOG_ORDER_KEY, JSON.stringify(data.order));
        }
        cloudReady = true;
        setCloudStatus("synced");
        if(!timedOut){ clearTimeout(timer); onDone(); }
      }).catch(function(){
        setCloudStatus("error");
        if(!timedOut){ clearTimeout(timer); onDone(); }
      });
    }catch(e){
      onDone();
    }
  }

  function loadCatalog(){
    var cat = defaultCatalog();
    var overrides = readJSON(CATALOG_OVERRIDES_KEY, {});
    var order = readJSON(CATALOG_ORDER_KEY, {});

    // Field-level edits (unit, par, supplier, etc.) apply onto whatever the
    // current default item looks like. An override for an id that no longer
    // exists (an item was removed in a later catalog update) is simply
    // never applied -- harmless leftover, not an error.
    cat.forEach(function(item){
      var o = overrides[item.id];
      if(!o) return;
      Object.keys(o).forEach(function(field){ item[field] = o[field]; });
    });

    // Custom fridge-walk order applies within each store+supplier+section
    // group (food and Bar are reordered independently -- see
    // isBarCategory). Items from the saved order that still exist keep
    // that relative sequence; anything new in that group (added since the
    // order was last saved) gets appended after them, in the default
    // catalog's own order, rather than being lost or inserted arbitrarily.
    Object.keys(order).forEach(function(key){
      var slots = [];
      cat.forEach(function(item, idx){
        var itemKey = item.store+"|"+item.supplier+"|"+(isBarCategory(item.category)?"bar":"food");
        if(itemKey === key) slots.push(idx);
      });
      if(slots.length === 0) return;
      var byId = {};
      cat.forEach(function(item){ byId[item.id] = item; });
      var currentIds = slots.map(function(idx){ return cat[idx].id; });
      var savedIds = order[key].filter(function(id){ return currentIds.indexOf(id) !== -1; });
      var newIds = currentIds.filter(function(id){ return savedIds.indexOf(id) === -1; });
      var finalIds = savedIds.concat(newIds);
      slots.forEach(function(slotIdx, i){ cat[slotIdx] = byId[finalIds[i]]; });
    });

    return cat;
  }

  // Records one field edit for one item, merged into whatever's already
  // saved for it -- never a wholesale catalog snapshot.
  function saveCatalogFieldEdit(itemId, field, value){
    var overrides = readJSON(CATALOG_OVERRIDES_KEY, {});
    if(!overrides[itemId]) overrides[itemId] = {};
    overrides[itemId][field] = value;
    writeJSON(CATALOG_OVERRIDES_KEY, overrides);
    scheduleCatalogSync();
  }

  // Records the fridge-walk order for one store+supplier group.
  function saveCatalogOrder(store, supplier, section, orderedIds){
    var order = readJSON(CATALOG_ORDER_KEY, {});
    order[store+"|"+supplier+"|"+section] = orderedIds;
    writeJSON(CATALOG_ORDER_KEY, order);
    scheduleCatalogSync();
  }

  function resetCatalogEdits(){
    writeJSON(CATALOG_OVERRIDES_KEY, {});
    writeJSON(CATALOG_ORDER_KEY, {});
    scheduleCatalogSync();
  }

  function sessionKey(store, cycle){ return SESSION_KEY_PREFIX + store + "_" + cycle; }
  function loadSession(store, cycle){
    var session = readJSON(sessionKey(store, cycle), { items:{}, staffName:null, startedAt:null });
    if(!session.collapsed) session.collapsed = {}; // supplier-group collapse overrides
    return session;
  }
  function saveSession(store, cycle, session){ writeJSON(sessionKey(store, cycle), session); }
  function clearSession(store, cycle){ try{ localStorage.removeItem(sessionKey(store, cycle)); }catch(e){} }

  // A supplier group auto-collapses once every item in it is touched
  // (entered or skipped) — but a manual tap always overrides that default,
  // in either direction, until the user taps it again.
  function supplierCollapsed(session, supplier, remaining){
    var explicit = session.collapsed ? session.collapsed[supplier] : undefined;
    if(typeof explicit === "boolean") return explicit;
    return remaining === 0;
  }

  function loadAppState(){ return readJSON(APP_STATE_KEY, null); }
  function saveAppState(s){ writeJSON(APP_STATE_KEY, s); }

  /* ============================= STATE ============================= */

  var catalog; // assigned in boot(), after any cloud restore has had a chance to run first

  var state = {
    screen: "store",       // store | name | order | item-info | success
    store: null,
    staffName: null,
    cycle: nearestCycle(),
    itemInfoFilter: null, // set to the current store when Item Info opens; no combined "all" view
    lastSubmission: null,
    confirmSubmitOpen: false,
    confirmResetOpen: false,
    reorderSupplier: null, // supplier name currently in drag-to-reorder mode on Item Info, or null
    reorderSection: null, // "food" | "bar" -- which half of that supplier is being reordered
    historyItems: undefined, // undefined = not fetched yet, null = loading, array = loaded (shared across everyone)
    historyError: false,
    historyReturnTo: null,
    historyWriteStatus: null, // null | "pending" | "ok" | "error" | "unavailable" -- shown on the success screen
    historyWriteError: null, // actual Firestore error code/message, shown alongside historyWriteStatus "error"
    searchQuery: "",
    itemInfoSearch: "",
    expandedInfo: {}, // itemId -> true, which rows have their info panel open (transient, not persisted)
    customOnHand: {}, // itemId -> true, rows switched from the quick-pick dropdown to free typing
    openOnHandPicker: null, // itemId of the one custom dropdown currently open, or null
    printData: null,   // {storeName, cycle, staffName, date, items:[{item,order}]} for the print screen
    printReturnTo: "order",
    settingsReturnTo: "store"
  };

  function restoreAppState(){
    var saved = loadAppState();
    if(saved && saved.store && (saved.screen === "order" || saved.screen === "item-info")){
      state.store = saved.store;
      state.staffName = saved.staffName || null;
      state.cycle = saved.cycle || nearestCycle();
      state.screen = saved.screen;
    }
  }

  function nearestCycle(){
    // Wed = 3, Sun = 0. Default to whichever comes first from today.
    var day = new Date().getDay();
    var toWed = (3 - day + 7) % 7;
    var toSun = (0 - day + 7) % 7;
    return toSun <= toWed ? "sun" : "wed";
  }

  function persistAppState(){
    saveAppState({ screen: state.screen, store: state.store, staffName: state.staffName, cycle: state.cycle });
  }

  function go(screen){
    state.screen = screen;
    persistAppState();
    render();
    window.scrollTo(0,0);
  }

  /* ============================= HELPERS ============================= */

  function fmt(n){
    return Number(n||0).toLocaleString("pt-PT", { maximumFractionDigits: 1 });
  }
  function itemsForStore(store){ return catalog.filter(function(i){ return i.store === store; }); }
  function parFor(item, cycle){ return cycle === "wed" ? item.parWed : item.parSun; }
  function cycleLabel(cycle){ return cycle === "wed" ? "Wed" : "Sun"; }

  // Accent-insensitive search (á/ç/etc. shouldn't have to be typed exactly)
  // across name, Spanish name, supplier, category and unit.
  function normalizeSearch(s){
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function matchesSearch(item, query){
    if(!query) return true;
    var q = normalizeSearch(query);
    var haystack = normalizeSearch([item.name, item.nameEs, item.supplier, item.category, item.unit].filter(Boolean).join(" "));
    return haystack.indexOf(q) !== -1;
  }
  function escHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function entryFor(session, item){
    if(!session.items[item.id]){
      session.items[item.id] = { onHand:"", order:"", manualOrder:false, skipped:false };
    }
    return session.items[item.id];
  }

  function recomputeOrder(entry, item){
    if(entry.manualOrder) return;
    var onHand = entry.onHand === "" ? 0 : parseFloat(entry.onHand) || 0;
    var par = parFor(item, state.cycle);
    var suggested = Math.max(par - onHand, 0);
    entry.order = String(suggested);
  }

  // An item tracked by eye as a fraction of a box (unitsPerBox:1 is the
  // signal — see Apples) gets quarter-box quick-picks with friendly glyphs
  // instead of raw decimals like "0.25", since nobody's actually counting
  // individual apples to produce that number.
  function isBoxFractionItem(item){
    return item.unitsPerBox === 1;
  }
  var BOX_FRACTION_GLYPHS = { 0:"Empty", 0.25:"¼", 0.5:"½", 0.75:"¾", 1:"Full", 1.25:"1¼", 1.5:"1½", 1.75:"1¾", 2:"2" };
  function fmtBoxFraction(n){
    return BOX_FRACTION_GLYPHS.hasOwnProperty(n) ? BOX_FRACTION_GLYPHS[n] : fmt(n);
  }

  // Quick-pick values for the "You have" dropdown: 0-20 covers most
  // real counts, a few round numbers beyond that for high-count items,
  // and the item's own par targets (even fractional ones, like 0.5) so
  // "right at par" is always one tap away. The current value is folded
  // in too, so switching back from manual entry never hides what's there.
  function onHandOptions(item, currentValue){
    var opts = [];
    if(isBoxFractionItem(item)){
      opts = [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
    } else {
      for(var i=0;i<=10;i++) opts.push(i);
    }
    [item.parWed, item.parSun].forEach(function(p){
      if(p!=null && opts.indexOf(p)===-1) opts.push(p);
    });
    var cv = parseFloat(currentValue);
    if(currentValue !== "" && !isNaN(cv) && opts.indexOf(cv)===-1) opts.push(cv);
    opts.sort(function(a,b){ return a-b; });
    return opts;
  }

  function isTouched(entry){
    return entry.skipped || entry.onHand !== "";
  }

  // Single rounding rule: if unitsPerBox is set and Order isn't a multiple
  // of it, it always rounds UP to the nearest multiple. Purely informational
  // — never blocks submission.
  function packNote(item, entry){
    if(!item.unitsPerBox) return null;
    var order = parseFloat(entry.order);
    if(!order || order <= 0) return null;
    var m = item.unitsPerBox;
    var remainder = order % m;
    if(Math.abs(remainder) < 1e-6 || Math.abs(remainder - m) < 1e-6) return null;
    var rounded = Math.ceil(order / m) * m;
    // unitsPerBox:1 means the box itself is the unit (see isBoxFractionItem,
    // e.g. Apples) -- "(box of 1)" doesn't mean anything there, so drop the
    // qualifier and just say how many boxes.
    if(m === 1) return "Rounds up to " + fmt(rounded) + (rounded === 1 ? " box." : " boxes.");
    return "Rounds up to " + fmt(rounded) + " (box of " + m + ").";
  }

  // Live weight reference — only meaningful (and only shown) when the item
  // has a weightPerUnit set. Order is entered in the item's natural unit.
  function liveCalc(item, entry){
    if(!item.weightPerUnit) return null;
    var order = parseFloat(entry.order) || 0;
    var total = order * item.weightPerUnit;
    return fmt(total) + "g total";
  }

  // Box weight is derived, never stored — unitsPerBox × weightPerUnit.
  function boxWeight(item){
    if(!item.unitsPerBox || !item.weightPerUnit) return null;
    return item.unitsPerBox * item.weightPerUnit;
  }

  /* ============================= RENDER ROOT ============================= */

  var app = document.getElementById("app");

  function render(){
    // A row auto-collapsing (e.g. a supplier/section finishing and folding
    // up) shrinks the page height above wherever you're looking, which
    // otherwise visibly drags the whole list up/down under you. Anchor to
    // whichever item row is currently topmost on screen before rebuilding
    // the DOM, then nudge the scroll position after so that same row
    // stays exactly where it was -- nothing appears to move underneath you.
    var anchorId = null, anchorTop = 0;
    var rows = app.querySelectorAll("[data-item]");
    for(var i=0;i<rows.length;i++){
      var rect = rows[i].getBoundingClientRect();
      if(rect.bottom > 0){
        anchorId = rows[i].getAttribute("data-item");
        anchorTop = rect.top;
        break;
      }
    }

    var html = "";
    if(state.screen === "store") html = renderStoreSelect();
    else if(state.screen === "name") html = renderNameSelect();
    else if(state.screen === "order") html = renderOrderList();
    else if(state.screen === "item-info") html = renderItemInfo();
    else if(state.screen === "success") html = renderSuccess();
    else if(state.screen === "print") html = renderPrintView();
    else if(state.screen === "history"){
      if(state.historyItems === undefined) loadHistory();
      html = renderHistory();
    }
    else if(state.screen === "settings") html = renderSettingsPreview();
    app.innerHTML = html;
    updateStickyOffsets();
    initSortable();

    if(anchorId){
      var freshEl = app.querySelector('[data-item="'+anchorId+'"]');
      if(freshEl){
        var delta = freshEl.getBoundingClientRect().top - anchorTop;
        if(delta) window.scrollBy(0, delta);
      }
    }
  }

  // The order list header (store/search/cycle/progress/columns) and the
  // Item Info header (store/search) are different heights, and both can
  // change height on their own (search clear button appearing, etc.) — so
  // rather than guess a pixel offset for where the supplier header should
  // stick, measure what's actually on screen after every render.
  // Only the thin bar right above the list (column labels on the order
  // list, filter tabs on Item Info) stays pinned while scrolling — the
  // heavier identity/search/cycle block above it scrolls away, so a small
  // phone screen gives the actual list as much room as possible. The
  // supplier header sticks right below whichever thin bar is present.
  function updateStickyOffsets(){
    var anchor = app.querySelector(".column-header") || app.querySelector(".filter-tabs");
    var anchorH = anchor ? anchor.getBoundingClientRect().height : 0;
    app.style.setProperty("--content-top", anchorH + "px");
  }

  // Reordering permutes the item's *position in the catalog array itself*
  // rather than adding a sort-index field — items keep their absolute
  // "slots" (so other suppliers/stores are untouched) but the slots
  // belonging to this store+supplier get filled with the new sequence.
  // Bar and food are reordered independently within a supplier (Bar stays
  // a separate section, never interleaved with food items even while
  // dragging), so this only touches the slots belonging to that one section.
  function reorderSupplierItems(store, supplier, section, newOrderIds){
    var slots = [];
    catalog.forEach(function(item, idx){
      if(item.store === store && item.supplier === supplier && (isBarCategory(item.category)?"bar":"food") === section) slots.push(idx);
    });
    var byId = {};
    catalog.forEach(function(item){ byId[item.id] = item; });
    slots.forEach(function(slotIdx, i){
      if(newOrderIds[i] && byId[newOrderIds[i]]) catalog[slotIdx] = byId[newOrderIds[i]];
    });
  }

  // SortableJS (loaded via CDN) drives the actual touch/mouse dragging —
  // native HTML5 drag-and-drop barely works on touchscreens, but a real
  // drag library handles that properly. Re-initializes whenever the
  // reorder list is freshly rendered (a new DOM node each time).
  function initSortable(){
    var container = app.querySelector(".reorder-list");
    if(!container || typeof Sortable === "undefined") return;
    new Sortable(container, {
      handle: ".drag-handle",
      animation: 150,
      onEnd: function(){
        var ids = Array.prototype.map.call(container.querySelectorAll("[data-item]"), function(el){
          return el.getAttribute("data-item");
        });
        reorderSupplierItems(state.itemInfoFilter, state.reorderSupplier, state.reorderSection, ids);
        saveCatalogOrder(state.itemInfoFilter, state.reorderSupplier, state.reorderSection, ids);
      }
    });
  }

  /* ============================= SCREEN 1: STORE SELECT ============================= */

  function renderStoreSelect(){
    var cards = STORES.map(function(s){
      return '<div class="choice-card" data-action="pick-store" data-store="'+s.id+'">'+
        '<div class="icon">'+s.icon+'</div>'+
        '<div class="label">'+s.name+'</div>'+
        '<div class="sub">Wed &amp; Sun ordering</div>'+
      '</div>';
    }).join("");
    return (
      '<div class="centered-screen">'+
        '<div class="heading">'+
          '<div class="wordmark">Bonita</div>'+
          '<h1>Which location?</h1>'+
          '<div class="script">let\'s see what the shelves need</div>'+
        '</div>'+
        '<div class="choice-grid">'+cards+'</div>'+
        '<div class="steps"><span class="active"></span><span></span></div>'+
        '<button class="link-btn" data-action="open-settings">⚙ Settings (preview)</button>'+

  // Visual concept only — nothing here is wired up or persisted. It exists
  // to show what per-company configuration would look like if this became
  // a product other businesses could set up for themselves, instead of
  // cycles/suppliers/locations/staff being fixed in the code as they are
  // today for Bonita specifically.
  function renderSettingsPreview(){
    function section(title, hint, items, addLabel){

        section("Locations", "The store(s) staff pick from at the start.", STORES.map(function(s){return s.name;}), "Add a location")+
        section("Providers", "Every supplier currently used across the catalog.", allSuppliers, "Add a provider")+
        section("Staff", "Names shown on the name-select screen — per location, since different people fill out each one.", STORES.reduce(function(acc, s){
          return acc.concat((STAFF[s.id] || []).map(function(n){ return n + " (" + s.name + ")"; }));
        }, []), "Add a staff member")+

          '<h3>Reset this device</h3>'+
          '<p class="settings-hint">This one is real, not part of the concept preview above — useful while '+

          '<button class="settings-danger" data-action="request-reset">🗑 Reset everything on this device</button>'+
        '</div>'+

    );

  /* ============================= SCREEN 2: NAME SELECT ============================= */

  function renderNameSelect(){
    var rows = (STAFF[state.store] || []).map(function(n){

  /* ============================= SCREEN 3: ORDER LIST ============================= */

  // Two-level grouping: supplier (the brief's required grouping), then
  // category as a sub-header where the catalog has one — mirrors how the
  // real Café order sheets are laid out. Items with no category (e.g. the
  // still-placeholder DLC list) fall into one unlabeled bucket per supplier.
  // Fixed display order for known suppliers (Eugen before Asko), independent
  // of whatever order they happen to appear in the catalog array. Anything
  // not listed here falls in after, in first-appearance order.
  var SUPPLIER_ORDER = ["Eugen", "Asko"];

  // Suppliers already in use for a store — drives the Supplier dropdown on
  // Item Info. Reassigning to a new supplier that's never been used before
  // isn't offered here on purpose; that's a bigger change than a per-item
  // fix and is worth a real conversation, not a stray typo in a dropdown.
  function suppliersForStore(store){
    var seen = {};
    var list = [];
    catalog.forEach(function(i){
      if(i.store === store && !seen[i.supplier]){ seen[i.supplier] = true; list.push(i.supplier); }
    });
    list.sort(function(a, b){
      var ia = SUPPLIER_ORDER.indexOf(a), ib = SUPPLIER_ORDER.indexOf(b);
      if(ia === -1) ia = SUPPLIER_ORDER.length;
      if(ib === -1) ib = SUPPLIER_ORDER.length;
      return ia - ib;
    });
    return list;
  }

  // Bar is a different department, not just another food category -- it
  // keeps its own hard section break (and its own independent reorder
  // scope) separate from everything else in the supplier, while all the
  // *food* categories (Dairy, Produce, etc.) no longer do.
  function isBarCategory(category){
    return category === "Bar" || (!!category && category.indexOf("Bar:") === 0);
  }

  // Groups by supplier, then splits each supplier into two flat lists:
  // regular items and Bar items. Category is no longer a hard section
  // break within either list -- real fridges/shelves don't respect the
  // app's category labels any more than they respect alphabetical order.
  // Items stay in whatever order the catalog array has them in (the
  // default authoring order, or a fridge-walk order once someone's
  // dragged them), and each item shows its category as a small inline
  // tag instead of a header.
  function groupBySupplier(items){
    var supplierOrder = [];
    var suppliers = {};
    items.forEach(function(item){
      if(!suppliers[item.supplier]){
        suppliers[item.supplier] = { supplier:item.supplier, items:[], barItems:[] };
        supplierOrder.push(item.supplier);
      }
      var sg = suppliers[item.supplier];
      (isBarCategory(item.category) ? sg.barItems : sg.items).push(item);
    });
    supplierOrder.sort(function(a, b){
      var ia = SUPPLIER_ORDER.indexOf(a), ib = SUPPLIER_ORDER.indexOf(b);
      if(ia === -1) ia = SUPPLIER_ORDER.length;
      if(ib === -1) ib = SUPPLIER_ORDER.length;
      return ia - ib;
    });
    return supplierOrder.map(function(s){ return suppliers[s]; });
  }

  function renderOrderList(){
    var items = itemsForStore(state.store);
    var session = loadSession(state.store, state.cycle);
    items.forEach(function(item){
      var entry = entryFor(session, item);
      recomputeOrder(entry, item);
    });
    saveSession(state.store, state.cycle, session);

    var touchedCount = items.filter(function(i){ return isTouched(entryFor(session,i)); }).length;
    var pct = items.length ? Math.round((touchedCount/items.length)*100) : 0;
    var storeName = STORES.filter(function(s){return s.id===state.store;})[0].name;

    // Search filters which rows render, but progress/session/submit always
    // reason about the full item list, not just what's currently visible.
    var visibleItems = items.filter(function(i){ return matchesSearch(i, state.searchQuery); });
    var groups = groupBySupplier(visibleItems);
    var groupsHtml = groups.map(function(g){
      var allItems = g.items.concat(g.barItems);
      var remaining = allItems.filter(function(i){ return !isTouched(entryFor(session,i)); }).length;
      // Search always shows full results, regardless of collapse state.
      var collapsed = state.searchQuery ? false : supplierCollapsed(session, g.supplier, remaining);
      var foodRemaining = g.items.filter(function(i){ return !isTouched(entryFor(session,i)); }).length;
      var barRemaining = g.barItems.filter(function(i){ return !isTouched(entryFor(session,i)); }).length;
      var foodSkipped = g.items.filter(function(i){ return entryFor(session,i).skipped; }).length;
      var barSkipped = g.barItems.filter(function(i){ return entryFor(session,i).skipped; }).length;
      var gs = escHtml(g.supplier);
      var skipFoodBtn =
        (foodRemaining > 0 ? '<button class="skip-section-btn" data-action="skip-section" data-supplier="'+gs+'" data-section="food">Skip rest</button>' : "")+
        (foodSkipped > 0 ? '<button class="skip-section-btn unskip" data-action="unskip-section" data-supplier="'+gs+'" data-section="food">Unskip all</button>' : "");
      var rowsHtml = collapsed ? "" : (
        (skipFoodBtn ? '<div class="section-actions">'+skipFoodBtn+'</div>' : "") +
        g.items.map(function(item){ return renderItemCard(item, entryFor(session,item)); }).join("")
      );
      var barHtml = (!collapsed && g.barItems.length) ? (
        '<div class="bar-section">'+
          '<div class="section-head"><span class="bar-section-label">🍹 Bar</span>'+
            (barRemaining > 0 ? '<button class="skip-section-btn" data-action="skip-section" data-supplier="'+gs+'" data-section="bar">Skip rest</button>' : "")+
            (barSkipped > 0 ? '<button class="skip-section-btn unskip" data-action="unskip-section" data-supplier="'+gs+'" data-section="bar">Unskip all</button>' : "")+
          '</div>'+
          g.barItems.map(function(item){ return renderItemCard(item, entryFor(session,item)); }).join("")+
        '</div>'
      ) : "";
      return (
        '<div class="supplier-group">'+
          '<button class="supplier-head" data-action="toggle-supplier" data-supplier="'+gs+'">'+
            '<h2>'+gs+'</h2>'+
            '<span class="supplier-head-right"><span class="count">'+
              (remaining===0 ? "all reviewed" : remaining+" left")+
            '</span><span class="chevron">'+(collapsed?"▸":"▾")+'</span></span>'+
          '</button>'+
          rowsHtml+
          barHtml+
        '</div>'
      );
    }).join("");
    if(visibleItems.length === 0){
      groupsHtml = '<div class="empty-search">No items match "'+escHtml(state.searchQuery)+'".</div>';
    }

    return (
      '<div class="app-header">'+
        '<div class="row1">'+
          '<div class="identity"><span class="store">'+escHtml(storeName)+'</span><span class="staff">'+escHtml(state.staffName)+'</span></div>'+
          '<div class="header-actions">'+
            '<button class="icon-btn" data-action="open-item-info" title="Item catalog"><span>📖</span><span class="icon-btn-label">Catalog</span></button>'+

  // Wipes every bonita_ol_* key regardless of exact naming (session keys are
  // per store+cycle) so this stays correct even as new keys get added later.
  function resetEverything(){
    var keysToRemove = [];
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf("bonita_ol_") === 0) keysToRemove.push(k);
    }
    keysToRemove.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });

    // Local wipe alone isn't enough: this device's private cloud backup
    // (submissions, in-progress sessions) would otherwise restore itself
    // right back on the very next load. Deliberately NOT touching
    // shared_catalog here -- that's shared data, not this device's own,
    // and should survive a per-device reset.
    function finishReset(){
      try{ location.reload(); }catch(e){}
      // Fallback in case a full reload gets blocked by the viewer sandbox
      // (window.print() was, once) - the data is already wiped either way,
      // so re-seed in memory and jump back to the start so it's visible too.
      catalog = defaultCatalog();
      state.store = null; state.staffName = null; state.lastSubmission = null;
      state.expandedInfo = {}; state.customOnHand = {}; state.openOnHandPicker = null;
      state.confirmResetOpen = false; state.confirmSubmitOpen = false; state.printData = null;
      state.screen = "store";
      render();
    }

    if(isFirebaseConfigured() && cloudReady && cloudUid){
      // Wait for the delete to actually go out before reloading -- an
      // in-flight request can get cancelled by the page unload otherwise.
      firebase.firestore().collection("users").doc(cloudUid).delete()
        .then(finishReset).catch(finishReset);
    } else {
      finishReset();
    }
  }

  /* ============================= ORDER HISTORY (shared) ============================= */

  // Every submission everyone has ever made, read from a shared Firestore
  // collection (not the per-device backup doc) so this is genuinely shared
  // across whoever opens the app, not just a log of this one browser's own
  // submissions. Falls back to an empty/error state if Firebase isn't set
  // up or the read fails — there's no local-only fallback for this screen,
  // since "shared" is the whole point of it.
  function loadHistory(){
    state.historyItems = null; // loading
    state.historyError = false;
    if(!isFirebaseConfigured() || !cloudReady){
      state.historyItems = [];
      render();
      return;
    }
    firebase.firestore().collection("shared_submissions").orderBy("submittedAt", "desc").limit(50).get()
      .then(function(snap){
        state.historyItems = snap.docs.map(function(doc){
          var data = doc.data();
          data.id = doc.id;
          return data;
        });
        render();
      })
      .catch(function(){
        state.historyItems = [];
        state.historyError = true;
        render();
      });
  }

  function renderHistory(){
    var body;
    if(!isFirebaseConfigured()){
      body = '<div class="empty-search">Shared history needs the cloud connection set up first — see the README.</div>';
    } else if(state.historyItems === null){
      body = '<div class="empty-search">Loading…</div>';
    } else if(state.historyError){
      body = '<div class="empty-search">Couldn\'t load shared history right now. Check your connection and try again.</div>';
    } else if(state.historyItems.length === 0){
      body = '<div class="empty-search">No orders submitted yet.</div>';
    } else {
      body = state.historyItems.map(function(sub){
        return (
          '<button class="history-row" data-action="view-history-item" data-id="'+escHtml(sub.id)+'">'+
            '<span class="history-row-main">'+
              '<b>'+escHtml(sub.storeName)+' · '+cycleLabel(sub.cycle)+'</b>'+
              '<span class="history-meta">'+escHtml(sub.date)+' · '+escHtml(sub.staffName)+' · '+escHtml(sub.itemCount)+' items</span>'+
            '</span>'+
            '<span class="history-chevron">›</span>'+
          '</button>'
        );
      }).join("");
    }
    return (
      '<div class="app-header">'+
        '<div class="row1">'+
          '<div class="identity"><span class="store">Order history</span><span class="staff">shared with everyone</span></div>'+
          '<div class="header-actions"><button class="icon-btn" data-action="close-history">✕</button></div>'+
        '</div>'+
      '</div>'+
      '<div class="list-body history-list">'+body+'</div>'
    );
  }

  // Convert a raw order quantity into what a manager actually asks the
  // supplier for: whole boxes when a box size is known ("1 box", never a
  // fraction — you can't order half a box), otherwise the raw quantity in
  // whatever unit the item is tracked in.
  function printQty(item, order){
    if(item.unitsPerBox){
      var boxes = Math.ceil(order / item.unitsPerBox - 1e-9);
      return boxes + (boxes === 1 ? " box" : " boxes");
    }
    return fmt(order) + " " + item.unit;
  }

  function groupPrintLines(lines){
    var supplierOrder = [];
    var suppliers = {};
    lines.forEach(function(l){
      var s = l.item.supplier;
      if(!suppliers[s]){ suppliers[s] = []; supplierOrder.push(s); }
      suppliers[s].push(l);
    });
    supplierOrder.sort(function(a, b){
      var ia = SUPPLIER_ORDER.indexOf(a), ib = SUPPLIER_ORDER.indexOf(b);
      if(ia === -1) ia = SUPPLIER_ORDER.length;
      if(ib === -1) ib = SUPPLIER_ORDER.length;
      return ia - ib;
    });
    return supplierOrder.map(function(s){ return { supplier: s, lines: suppliers[s] }; });
  }

  // The printable order — what actually gets sent to/read by the manager.
  // Only items with something to order show up: no skipped items, nothing
  // at zero. window.print() (native browser/OS print, works on iPad/phone
  // as "Save as PDF" too) does the rest — no library, no server round trip.
  // Plain-text version of the order, for clipboard/share — window.print()
  // doesn't work inside the Artifact viewer's sandbox, so copy-and-paste
  // (into WhatsApp, email, Notes, whatever) is the reliable path here.
  function buildPrintText(d){
    var lines = [d.storeName+" — Order", cycleLabel(d.cycle)+" cycle · "+d.date+" · prepared by "+d.staffName, ""];
    var groups = groupPrintLines(d.items);
    if(groups.length === 0){
      lines.push("Nothing to order this cycle.");
    } else {
      groups.forEach(function(g){
        lines.push(g.supplier.toUpperCase());
        g.lines.forEach(function(l){
          var esPart = l.item.nameEs ? " ("+l.item.nameEs+")" : "";
          lines.push("- "+l.item.name+esPart+": "+printQty(l.item, l.order));
        });
        lines.push("");
      });
    }
    return lines.join("\n").trim();
  }

  // Rebuilds the printData shape from a saved submission record, so both
  // "View / print this order" and "Copy order" on the success screen can
  // show the exact list that was submitted, not the (now-cleared) session.
  function printDataFromSubmission(sub){
    var subLines = sub.items.filter(function(i){
        var touched = i.skipped || i.onHand !== "";
        return touched && !i.skipped && (parseFloat(i.order)||0) > 0;
      })
      .map(function(i){ return { item: i, order: parseFloat(i.order) || 0 }; });
    return { storeName: sub.storeName, cycle: sub.cycle, staffName: sub.staffName, date: sub.date, items: subLines };
  }

  // Shared clipboard-copy + flash-message behavior, used by the print
  // screen's "Copy order" and the success screen's "Copy order" alike.
  function copyOrderText(text){
    var flash = app.querySelector('[data-role="copy-flash"]');
    function showFlash(msg){
      if(!flash) return;
      flash.textContent = msg;
      flash.hidden = false;
      clearTimeout(flash._t);
      flash._t = setTimeout(function(){ flash.hidden = true; }, 3000);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showFlash("Copied — paste it into WhatsApp, email, or Notes.");
      }).catch(function(){
        showFlash("Couldn't copy automatically — tap-and-hold the list above to select and copy it manually.");
      });
    } else {
      showFlash("Copy isn't available here — tap-and-hold the list above to select and copy it manually.");
    }
  }

  function renderPrintView(){
    var d = state.printData;
    if(!d){
      return '<div class="centered-screen"><p>Nothing to show yet.</p><button class="link-btn" data-action="print-back">‹ Back</button></div>';
    }
    var groups = groupPrintLines(d.items);
    var groupsHtml = groups.map(function(g){
      var rows = g.lines.map(function(l){
        return (
          '<div class="print-row">'+
            '<span>'+escHtml(l.item.name)+(l.item.nameEs ? ' <i>('+escHtml(l.item.nameEs)+')</i>' : '')+'</span>'+
            '<b>'+escHtml(printQty(l.item, l.order))+'</b>'+
          '</div>'
        );
      }).join("");
      return '<div class="print-supplier"><h3>'+escHtml(g.supplier)+'</h3>'+rows+'</div>';
    }).join("");
    if(groups.length === 0) groupsHtml = '<p class="print-empty">Nothing to order this cycle.</p>';

    var canShare = typeof navigator !== "undefined" && typeof navigator.share === "function";
    // Submitting is only offered from the pre-submission preview (reached
    // from the order screen) — once a list is already submitted (reached
    // from the success screen), there's nothing left to submit, just copy.
    var canSubmit = state.printReturnTo === "order";
    var confirmModal = "";
    if(canSubmit && state.confirmSubmitOpen){
      var liveItems = itemsForStore(state.store);
      var liveSession = loadSession(state.store, state.cycle);
      var untouchedCount = liveItems.filter(function(i){ return !isTouched(entryFor(liveSession,i)); }).length;
      confirmModal = renderConfirmSheet(untouchedCount);
    }

    return (
      '<div class="print-page">'+
        '<div class="no-print top-actions">'+
          '<button class="icon-btn" data-action="print-back">‹</button>'+
          '<div class="top-actions-right">'+
            (canShare ? '<button class="preview-btn" data-action="share-order">Share…</button>' : '')+
            '<button class="preview-btn" data-action="copy-order">📋 Copy order</button>'+
            (canSubmit ? '<button class="submit-btn" data-action="request-submit">Submit list</button>' : '')+
          '</div>'+
        '</div>'+
        '<div class="no-print copy-flash" data-role="copy-flash" hidden>Copied — paste it into WhatsApp, email, or Notes.</div>'+
        '<div class="print-header">'+
          '<div class="wordmark">Bonita</div>'+
          '<h1>'+escHtml(d.storeName)+' — Order</h1>'+
          '<p>'+cycleLabel(d.cycle)+' cycle · '+escHtml(d.date)+' · prepared by '+escHtml(d.staffName)+'</p>'+
        '</div>'+
        groupsHtml+
        '<p class="no-print print-hint">Can\'t copy? Just tap-and-hold on the list above to select and copy it manually.</p>'+
      '</div>'+
      confirmModal
    );
  }

  /* ============================= EVENTS ============================= */

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "pick-store"){
      state.store = el.getAttribute("data-store");
      go("name");
    }
    else if(action === "back-to-store"){

      go("store");
    }

      go("order");
    }
    else if(action === "switch-user"){

      var supplierSession = loadSession(state.store, state.cycle);
      var supplierRemaining = supplierItems.filter(function(i){ return !isTouched(entryFor(supplierSession,i)); }).length;
      var currentlyCollapsed = supplierCollapsed(supplierSession, supplierName, supplierRemaining);

      go("item-info");

      var toggleId = el.getAttribute("data-item");
      state.openOnHandPicker = (state.openOnHandPicker === toggleId) ? null : toggleId;
      render();
    }
    else if(action === "pick-onhand"){
      var pickId = el.getAttribute("data-item");
      var pickItem = catalog.filter(function(i){return i.id===pickId;})[0];
      var pickSession = loadSession(state.store, state.cycle);
      var pickEntry = entryFor(pickSession, pickItem);
      pickEntry.onHand = el.getAttribute("data-value");
      if(pickEntry.skipped) pickEntry.skipped = false;
      recomputeOrder(pickEntry, pickItem);
      saveSession(state.store, state.cycle, pickSession);

    else if(action === "pick-onhand-other"){
